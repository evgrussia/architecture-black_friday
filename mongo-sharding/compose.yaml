name: mongo-sharding

services:
  configsrv:
    container_name: configsrv
    image: mongo:7
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--bind_ip_all", "--port", "27019"]
    volumes:
      - configsrv_data:/data/db
    networks:
      - mongo-net

  shard1:
    container_name: shard1
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "rs1", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard1_data:/data/db
    networks:
      - mongo-net

  shard2:
    container_name: shard2
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "rs2", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard2_data:/data/db
    networks:
      - mongo-net

  mongos:
    container_name: mongos
    image: mongo:7
    command: ["mongos", "--configdb", "configReplSet/configsrv:27019", "--bind_ip_all", "--port", "27017"]
    depends_on:
      - configsrv
      - shard1
      - shard2
    networks:
      - mongo-net

  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"
    networks:
      - mongo-net

volumes:
  configsrv_data:
  shard1_data:
  shard2_data:

networks:
  mongo-net:
    driver: bridge
